name: Migrate Knowledge data to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration inputs
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          test -n "$SOURCE_DATABASE_URL"
          test -n "$SUPABASE_DATABASE_URL"

      - name: Migrate Knowledge data
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          REQUIRE_EMPTY_TARGET: "true"
        run: node scripts/migrate-knowledge-to-supabase.mjs
