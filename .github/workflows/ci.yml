name: Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Keep CI aligned with Render's production-environment install.
        run: npm ci --include=dev

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: |
          node --check scripts/migrate-knowledge-to-supabase.mjs
          npm test

      - name: Build
        run: npm run build
